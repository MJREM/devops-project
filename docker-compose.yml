services:

  nginx:
    image: nginx:latest

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - web


  web:
    build: .
    ports:
      - "5000:5000"

    environment:
      DB_HOST: db
      DB_NAME: companydb
      DB_USER: admin
      DB_PASSWORD: admin123


  db:
    image: postgres:16

    environment:
      POSTGRES_DB: companydb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: